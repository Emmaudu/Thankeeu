      display:none;position:fixed;inset:0;z-index:99999;
      background:#0f0720;

      <div style="width:48px;height:3px;border-radius:99px;background:rgba(255,255,255,0.15);overflow:hidden;position:relative;">
        <div id="splash-bar" style="position:absolute;left:-100%;top:0;height:100%;width:100%;
          background:#ff2d62;border-radius:99px;
          animation:splashbar 1.4s ease-in-out infinite;"></div>
      </div>
      <p style="color:rgba(255,255,255,0.45);font-size:13px;font-weight:600;margin:0;">Getting things ready…</p>
    </div>
    <style>@keyframes splashbar{0%{left:-100%}50%{left:0}100%{left:100%}}</style>
    <script>
      // Only show the splash if we are running as an installed PWA (standalone)
      // AND the page takes more than 400ms to load. This avoids flash-of-splash
      // on fast networks while still giving feedback on slow mobile data.
      var _splashTimer = null;
      var _isPWA = window.matchMedia('(display-mode:standalone)').matches || window.navigator.standalone;
      if (_isPWA) {
        _splashTimer = setTimeout(function() {
          var el = document.getElementById('pwa-splash');
          if (el) el.style.display = 'flex';
        }, 400);
      }
      window.__hideSplash = function() {
        if (_splashTimer) clearTimeout(_splashTimer);
        var el = document.getElementById('pwa-splash');
        if (!el) return;
        el.style.transition = 'opacity 0.25s ease';
        el.style.opacity = '0';
        setTimeout(function(){ el.style.display = 'none'; }, 260);
      };
    </script>
