<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F3EEFF"/>
      <stop offset="100%" style="stop-color:#E8D5FF"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="280" rx="18" fill="url(#bg1)"/>
  <!-- Stars/sparkles -->
  <text x="30" y="40" font-size="14" fill="#C084FC" opacity="0.7">✦</text>
  <text x="355" y="55" font-size="10" fill="#A855F7" opacity="0.6">✦</text>
  <text x="370" y="220" font-size="12" fill="#C084FC" opacity="0.5">✦</text>
  <text x="15" y="200" font-size="8" fill="#A855F7" opacity="0.6">✦</text>
  <!-- Balloons -->
  <ellipse cx="60" cy="80" rx="22" ry="28" fill="#F9A8D4" opacity="0.9"/>
  <line x1="60" y1="108" x2="62" y2="135" stroke="#F9A8D4" stroke-width="1.5"/>
  <ellipse cx="95" cy="65" rx="20" ry="26" fill="#C084FC" opacity="0.9"/>
  <line x1="95" y1="91" x2="97" y2="135" stroke="#C084FC" stroke-width="1.5"/>
  <ellipse cx="128" cy="78" rx="21" ry="27" fill="#FCD34D" opacity="0.9"/>
  <line x1="128" y1="105" x2="126" y2="135" stroke="#FCD34D" stroke-width="1.5"/>
  <!-- Balloon shine -->
  <ellipse cx="55" cy="72" rx="6" ry="8" fill="white" opacity="0.3"/>
  <ellipse cx="90" cy="58" rx="5" ry="7" fill="white" opacity="0.3"/>
  <ellipse cx="123" cy="70" rx="5" ry="7" fill="white" opacity="0.3"/>
  <!-- Cake -->
  <rect x="270" y="160" width="80" height="50" rx="5" fill="#F9A8D4"/>
  <rect x="275" y="150" width="70" height="20" rx="4" fill="#F472B6"/>
  <rect x="280" y="142" width="60" height="15" rx="4" fill="#EC4899"/>
  <!-- Cake frosting drips -->
  <path d="M275 150 Q282 160 289 150 Q296 160 303 150 Q310 160 317 150 Q324 160 331 150 Q338 160 345 150" fill="none" stroke="white" stroke-width="2.5" opacity="0.6"/>
  <!-- Candles -->
  <rect x="295" y="128" width="6" height="16" rx="2" fill="#FDE68A"/>
  <rect x="312" y="125" width="6" height="19" rx="2" fill="#FDE68A"/>
  <rect x="329" y="128" width="6" height="16" rx="2" fill="#FDE68A"/>
  <!-- Flames -->
  <ellipse cx="298" cy="126" rx="3" ry="4" fill="#F97316"/>
  <ellipse cx="315" cy="123" rx="3" ry="4" fill="#F97316"/>
  <ellipse cx="332" cy="126" rx="3" ry="4" fill="#F97316"/>
  <!-- Cake dots -->
  <circle cx="290" cy="178" r="3" fill="#EC4899"/>
  <circle cx="305" cy="182" r="3" fill="#EC4899"/>
  <circle cx="320" cy="175" r="3" fill="#EC4899"/>
  <circle cx="335" cy="180" r="3" fill="#EC4899"/>
  <!-- Title -->
  <text x="200" y="130" font-family="Georgia, serif" font-size="38" font-weight="bold" font-style="italic" fill="#7C3AED" text-anchor="middle">Happy</text>
  <text x="200" y="168" font-family="Georgia, serif" font-size="38" font-weight="bold" font-style="italic" fill="#7C3AED" text-anchor="middle">Birthday!</text>
  <!-- Subtitle -->
  <text x="200" y="200" font-family="Georgia, serif" font-size="13" fill="#9333EA" text-anchor="middle">Wishing you a day filled with</text>
  <text x="200" y="218" font-family="Georgia, serif" font-size="13" fill="#9333EA" text-anchor="middle">joy and wonderful memories.</text>
  <!-- Heart -->
  <text x="200" y="245" font-size="14" fill="#EC4899" text-anchor="middle">♥</text>
  <!-- Confetti dots -->
  <circle cx="160" cy="50" r="4" fill="#FCD34D" opacity="0.7"/>
  <circle cx="240" cy="35" r="3" fill="#F9A8D4" opacity="0.8"/>
  <circle cx="340" cy="100" r="4" fill="#C084FC" opacity="0.6"/>
  <circle cx="350" cy="155" r="3" fill="#FCD34D" opacity="0.7"/>
</svg>
