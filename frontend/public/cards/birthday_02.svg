  </defs>
  <rect width="400" height="280" rx="18" fill="url(#bg2)"/>
  <!-- Stars -->
  <circle cx="40" cy="30" r="1.5" fill="#FCD34D" opacity="0.8"/>
  <circle cx="80" cy="55" r="1" fill="white" opacity="0.6"/>
  <circle cx="150" cy="20" r="1.5" fill="#FCD34D" opacity="0.7"/>
  <circle cx="250" cy="25" r="1" fill="white" opacity="0.5"/>
  <circle cx="330" cy="40" r="1.5" fill="#FCD34D" opacity="0.8"/>
  <circle cx="370" cy="15" r="1" fill="white" opacity="0.6"/>
  <circle cx="380" cy="200" r="1.5" fill="#FCD34D" opacity="0.5"/>
  <circle cx="20" cy="150" r="1" fill="white" opacity="0.4"/>
