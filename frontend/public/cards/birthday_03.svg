<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF0F5"/>
      <stop offset="100%" style="stop-color:#FFD6E8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="18" fill="url(#bg3)"/>
  <!-- Polka dots background -->
  <circle cx="30" cy="50" r="5" fill="#F9A8D4" opacity="0.4"/>
  <circle cx="80" cy="20" r="4" fill="#FCA5A5" opacity="0.3"/>
  <circle cx="370" cy="60" r="6" fill="#F9A8D4" opacity="0.4"/>
  <circle cx="350" cy="240" r="5" fill="#FCA5A5" opacity="0.35"/>
  <circle cx="20" cy="200" r="4" fill="#F9A8D4" opacity="0.3"/>
  <circle cx="380" cy="160" r="5" fill="#FCA5A5" opacity="0.4"/>
  <!-- Party hat -->
  <polygon points="310,180 345,60 380,180" fill="#EC4899"/>
  <polygon points="310,180 345,60 380,180" fill="none" stroke="white" stroke-width="1.5" opacity="0.4"/>
  <!-- Hat stripes -->
  <line x1="322" y1="155" x2="368" y2="155" stroke="white" stroke-width="2" opacity="0.5"/>
  <line x1="330" y1="128" x2="361" y2="128" stroke="white" stroke-width="2" opacity="0.5"/>
  <line x1="336" y1="104" x2="355" y2="104" stroke="white" stroke-width="2" opacity="0.5"/>
  <!-- Hat dots -->
  <circle cx="338" cy="168" r="4" fill="#FDE68A"/>
  <circle cx="352" cy="142" r="4" fill="#FDE68A"/>
  <circle cx="345" cy="116" r="3" fill="#FDE68A"/>
  <!-- Hat pompom -->
  <circle cx="345" cy="55" r="10" fill="#FDE68A"/>
  <circle cx="345" cy="55" r="7" fill="#F59E0B"/>
  <!-- Hat brim -->
  <ellipse cx="345" cy="182" rx="38" ry="8" fill="#BE185D"/>
  <!-- Bunting top -->
  <path d="M20,15 Q100,40 200,15 Q300,40 380,15" fill="none" stroke="#C084FC" stroke-width="2.5"/>
  <polygon points="40,15 55,35 70,15" fill="#F9A8D4"/>
  <polygon points="80,25 95,45 110,25" fill="#FCD34D"/>
  <polygon points="140,13 155,33 170,13" fill="#C084FC"/>
  <polygon points="210,13 225,33 240,13" fill="#F9A8D4"/>
  <polygon points="270,23 285,43 300,23" fill="#FCD34D"/>
  <polygon points="330,12 345,32 360,12" fill="#C084FC"/>
  <!-- Title -->
  <text x="190" y="125" font-family="Georgia, serif" font-size="40" font-weight="bold" font-style="italic" fill="#BE185D" text-anchor="middle">Happy</text>
  <text x="190" y="168" font-family="Georgia, serif" font-size="40" font-weight="bold" font-style="italic" fill="#BE185D" text-anchor="middle">Birthday!</text>
  <!-- Subtitle -->
  <text x="190" y="202" font-family="Georgia, serif" font-size="13" fill="#9D174D" text-anchor="middle">Hope your day is as special</text>
  <text x="190" y="220" font-family="Georgia, serif" font-size="13" fill="#9D174D" text-anchor="middle">and amazing as you are!</text>
  <text x="190" y="248" font-size="14" fill="#EC4899" text-anchor="middle">♥</text>
</svg>
