<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ECFDF5"/>
      <stop offset="100%" style="stop-color:#D1FAE5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="18" fill="url(#bg4)"/>
  <!-- Sparkles -->
  <text x="25" y="45" font-size="16" fill="#10B981" opacity="0.6">✦</text>
  <text x="360" y="55" font-size="12" fill="#059669" opacity="0.5">✦</text>
  <text x="375" y="230" font-size="10" fill="#10B981" opacity="0.4">✦</text>
  <text x="15" y="220" font-size="14" fill="#059669" opacity="0.5">✦</text>
  <!-- Gift box large -->
  <rect x="290" y="150" width="75" height="65" rx="5" fill="#34D399"/>
  <rect x="290" y="140" width="75" height="20" rx="4" fill="#10B981"/>
  <!-- Ribbon vertical -->
  <rect x="323" y="138" width="10" height="80" fill="#F59E0B"/>
  <!-- Ribbon horizontal -->
  <rect x="288" y="155" width="79" height="10" fill="#F59E0B"/>
  <!-- Bow -->
  <ellipse cx="328" cy="138" rx="14" ry="8" fill="#FCD34D" transform="rotate(-20 328 138)"/>
  <ellipse cx="328" cy="138" rx="14" ry="8" fill="#FCD34D" transform="rotate(20 328 138)"/>
  <circle cx="328" cy="138" r="6" fill="#F59E0B"/>
  <!-- Gift box small -->
  <rect x="240" y="185" width="50" height="45" rx="4" fill="#6EE7B7"/>
  <rect x="240" y="177" width="50" height="14" rx="3" fill="#34D399"/>
  <rect x="260" y="175" width="8" height="58" fill="#FCA5A5"/>
  <rect x="238" y="187" width="54" height="8" fill="#FCA5A5"/>
  <ellipse cx="264" cy="175" rx="10" ry="6" fill="#F9A8D4" transform="rotate(-15 264 175)"/>
  <ellipse cx="264" cy="175" rx="10" ry="6" fill="#F9A8D4" transform="rotate(15 264 175)"/>
  <circle cx="264" cy="175" r="4" fill="#FCA5A5"/>
  <!-- Confetti -->
  <rect x="50" y="50" width="8" height="4" rx="1" fill="#34D399" opacity="0.7" transform="rotate(25 54 52)"/>
  <rect x="120" y="35" width="7" height="3" rx="1" fill="#FCD34D" opacity="0.8" transform="rotate(-15 123 36)"/>
  <rect x="180" y="55" width="8" height="4" rx="1" fill="#F9A8D4" opacity="0.7" transform="rotate(40 184 57)"/>
  <circle cx="60" cy="240" r="5" fill="#34D399" opacity="0.4"/>
  <circle cx="380" cy="150" r="4" fill="#FCD34D" opacity="0.5"/>
  <!-- Title -->
  <text x="175" y="125" font-family="Georgia, serif" font-size="40" font-weight="bold" font-style="italic" fill="#065F46" text-anchor="middle">Happy</text>
  <text x="175" y="167" font-family="Georgia, serif" font-size="40" font-weight="bold" font-style="italic" fill="#065F46" text-anchor="middle">Birthday!</text>
  <!-- Subtitle -->
  <text x="175" y="202" font-family="Georgia, serif" font-size="13" fill="#047857" text-anchor="middle">May this year bring you</text>
  <text x="175" y="220" font-family="Georgia, serif" font-size="13" fill="#047857" text-anchor="middle">happiness and all your heart desires.</text>
  <text x="175" y="248" font-size="14" fill="#10B981" text-anchor="middle">♥</text>
</svg>
