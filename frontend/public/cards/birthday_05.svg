<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFBEB"/>
      <stop offset="100%" style="stop-color:#FEF3C7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="18" fill="url(#bg5)"/>
  <!-- Crown -->
  <polygon points="60,170 60,100 100,130 140,85 180,130 220,100 220,170" fill="#F59E0B"/>
  <polygon points="60,170 60,100 100,130 140,85 180,130 220,100 220,170" fill="none" stroke="#D97706" stroke-width="2"/>
  <!-- Crown gems -->
  <circle cx="140" cy="90" r="8" fill="#EC4899"/>
  <circle cx="100" cy="133" r="6" fill="#6366F1"/>
  <circle cx="180" cy="133" r="6" fill="#10B981"/>
  <!-- Crown band -->
  <rect x="60" y="158" width="160" height="15" rx="3" fill="#D97706"/>
  <circle cx="88" cy="165" r="5" fill="#FDE68A"/>
  <circle cx="116" cy="165" r="5" fill="#FDE68A"/>
  <circle cx="144" cy="165" r="5" fill="#FDE68A"/>
  <circle cx="172" cy="165" r="5" fill="#FDE68A"/>
  <circle cx="200" cy="165" r="5" fill="#FDE68A"/>
  <!-- Stars around crown -->
  <text x="35" y="95" font-size="18" fill="#F59E0B">★</text>
  <text x="220" y="88" font-size="16" fill="#F59E0B">★</text>
  <text x="248" y="120" font-size="14" fill="#FCD34D" opacity="0.8">★</text>
  <text x="15" y="140" font-size="12" fill="#FCD34D" opacity="0.7">★</text>
  <!-- Sparkles -->
  <text x="280" y="60" font-size="18" fill="#F59E0B" opacity="0.7">✦</text>
  <text x="350" y="90" font-size="14" fill="#D97706" opacity="0.6">✦</text>
  <text x="360" y="200" font-size="12" fill="#F59E0B" opacity="0.5">✦</text>
  <!-- Title -->
  <text x="310" y="145" font-family="Georgia, serif" font-size="36" font-weight="bold" font-style="italic" fill="#92400E" text-anchor="middle">Happy</text>
  <text x="310" y="185" font-family="Georgia, serif" font-size="36" font-weight="bold" font-style="italic" fill="#92400E" text-anchor="middle">Birthday!</text>
  <!-- Subtitle -->
  <text x="200" y="218" font-family="Georgia, serif" font-size="13" fill="#78350F" text-anchor="middle">You deserve to be celebrated</text>
  <text x="200" y="236" font-family="Georgia, serif" font-size="13" fill="#78350F" text-anchor="middle">like the royalty you are!</text>
  <text x="200" y="260" font-size="14" fill="#F59E0B" text-anchor="middle">♥</text>
</svg>
