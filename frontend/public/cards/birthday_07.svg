  <!-- Subtitle -->
  <text x="200" y="200" font-family="Georgia, serif" font-size="13" fill="#9A3412" text-anchor="middle">Today is YOUR day — shine bright,</text>
  <text x="200" y="218" font-family="Georgia, serif" font-size="13" fill="#9A3412" text-anchor="middle">laugh often, love always!</text>
