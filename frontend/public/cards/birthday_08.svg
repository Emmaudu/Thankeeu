  <text x="180" y="135" font-family="Georgia, serif" font-size="40" font-weight="bold" font-style="italic" fill="#1D4ED8" text-anchor="middle">Happy</text>
  <text x="180" y="177" font-family="Georgia, serif" font-size="40" font-weight="bold" font-style="italic" fill="#1D4ED8" text-anchor="middle">Birthday!</text>
  <!-- Subtitle -->
  <text x="180" y="212" font-family="Georgia, serif" font-size="13" fill="#1E40AF" text-anchor="middle">Wishing you blue skies and</text>
  <text x="180" y="230" font-family="Georgia, serif" font-size="13" fill="#1E40AF" text-anchor="middle">sunshine on your special day.</text>
  <text x="180" y="258" font-size="14" fill="#3B82F6" text-anchor="middle">♥</text>
