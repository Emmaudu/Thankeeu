  <text x="200" y="115" font-family="Georgia, serif" font-size="42" font-weight="bold" font-style="italic" fill="#14532D" text-anchor="middle">Happy</text>
  <text x="200" y="160" font-family="Georgia, serif" font-size="42" font-weight="bold" font-style="italic" fill="#14532D" text-anchor="middle">Birthday!</text>
  <text x="200" y="195" font-family="Georgia, serif" font-size="13" fill="#166534" text-anchor="middle">Grow, bloom, and flourish</text>
  <text x="200" y="213" font-family="Georgia, serif" font-size="13" fill="#166534" text-anchor="middle">— you deserve the very best.</text>
  <text x="200" y="245" font-size="14" fill="#4ADE80" text-anchor="middle">♥</text>
