  <ellipse cx="328" cy="168" rx="18" ry="9" fill="#4ADE80" transform="rotate(50 328 168)"/>
  <ellipse cx="318" cy="148" rx="15" ry="8" fill="#86EFAC" transform="rotate(65 318 148)"/>
  <!-- Small flowers -->
  <circle cx="90" cy="120" r="8" fill="#FCA5A5"/>
  <circle cx="90" cy="108" r="7" fill="#FCA5A5"/>
  <circle cx="98" cy="128" r="7" fill="#FCA5A5"/>
  <circle cx="82" cy="128" r="7" fill="#FCA5A5"/>
  <circle cx="82" cy="112" r="7" fill="#FCA5A5"/>
  <circle cx="98" cy="112" r="7" fill="#FCA5A5"/>
  <circle cx="90" cy="120" r="5" fill="#FDE68A"/>
  <circle cx="310" cy="120" r="8" fill="#FCA5A5"/>
  <circle cx="310" cy="108" r="7" fill="#FCA5A5"/>
  <circle cx="318" cy="128" r="7" fill="#FCA5A5"/>
  <circle cx="302" cy="128" r="7" fill="#FCA5A5"/>
  <circle cx="302" cy="112" r="7" fill="#FCA5A5"/>
  <circle cx="318" cy="112" r="7" fill="#FCA5A5"/>
  <circle cx="310" cy="120" r="5" fill="#FDE68A"/>
