  </defs>
  <rect width="400" height="280" rx="18" fill="url(#bg14)"/>
  <!-- Leaves/botanical left -->
  <path d="M30,260 Q60,180 80,140" fill="none" stroke="#4ADE80" stroke-width="3" stroke-linecap="round"/>
