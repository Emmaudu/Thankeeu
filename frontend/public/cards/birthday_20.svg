<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs><linearGradient id="bg20" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#FDF4FF"/><stop offset="100%" style="stop-color:#F5D0FE"/></linearGradient></defs>
  <rect width="400" height="280" rx="18" fill="url(#bg20)"/>
  <!-- Unicorn horn -->
  <polygon points="335,155 355,80 375,155" fill="#E879F9" opacity="0.8"/>
  <line x1="340" y1="148" x2="370" y2="148" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="342" y1="135" x2="368" y2="135" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="346" y1="122" x2="365" y2="122" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="350" y1="109" x2="361" y2="109" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <!-- Unicorn head -->
  <ellipse cx="340" cy="175" rx="35" ry="30" fill="#FAE8FF"/>
  <ellipse cx="355" cy="195" rx="18" ry="12" fill="#FAE8FF"/>
