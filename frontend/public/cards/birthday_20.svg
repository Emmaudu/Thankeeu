  <circle cx="348" cy="168" r="5" fill="#7C3AED"/>
  <circle cx="349" cy="167" r="2" fill="white"/>
  <!-- Mane ribbons -->
  <path d="M310,155 Q295,140 305,125 Q315,110 300,95" fill="none" stroke="#F472B6" stroke-width="4" stroke-linecap="round"/>
  <path d="M308,160 Q290,145 298,130 Q307,112 292,98" fill="none" stroke="#C084FC" stroke-width="3" stroke-linecap="round"/>
  <path d="M312,165 Q298,152 306,138 Q315,122 302,108" fill="none" stroke="#FCD34D" stroke-width="3" stroke-linecap="round"/>
  <!-- Sparkles around unicorn -->
  <text x="280" y="85" font-size="16" fill="#E879F9">✦</text>
  <text x="370" y="70" font-size="12" fill="#FCD34D" opacity="0.8">✦</text>
  <text x="390" y="130" font-size="10" fill="#C084FC" opacity="0.7">✦</text>
  <!-- Title -->
  <text x="175" y="115" font-family="Georgia, serif" font-size="40" font-weight="bold" font-style="italic" fill="#86198F" text-anchor="middle">Happy</text>
  <text x="175" y="158" font-family="Georgia, serif" font-size="40" font-weight="bold" font-style="italic" fill="#86198F" text-anchor="middle">Birthday!</text>
  <text x="175" y="193" font-family="Georgia, serif" font-size="13" fill="#9D174D" text-anchor="middle">You're pure magic —</text>
  <text x="175" y="211" font-family="Georgia, serif" font-size="13" fill="#9D174D" text-anchor="middle">rare, beautiful, and wonderful.</text>
  <text x="175" y="243" font-size="14" fill="#E879F9" text-anchor="middle">♥</text>
