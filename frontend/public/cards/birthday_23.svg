<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs><linearGradient id="bg23" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#F0FDF4"/><stop offset="100%" style="stop-color:#FFF7ED"/></linearGradient></defs>
  <rect width="400" height="280" rx="18" fill="url(#bg23)"/>
  <!-- Sunflowers right -->
  <!-- Petals -->
  <ellipse cx="355" cy="100" rx="10" ry="20" fill="#FCD34D" transform="rotate(0 355 100)"/>
  <ellipse cx="355" cy="100" rx="10" ry="20" fill="#FCD34D" transform="rotate(45 355 100)"/>
  <ellipse cx="355" cy="100" rx="10" ry="20" fill="#FCD34D" transform="rotate(90 355 100)"/>
  <ellipse cx="355" cy="100" rx="10" ry="20" fill="#FCD34D" transform="rotate(135 355 100)"/>
  <circle cx="355" cy="100" r="16" fill="#92400E"/>
  <circle cx="355" cy="100" r="10" fill="#78350F"/>
  <!-- Stem -->
  <path d="M355,116 Q348,150 345,190" fill="none" stroke="#4ADE80" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="340" cy="155" rx="14" ry="7" fill="#4ADE80" transform="rotate(-30 340 155)"/>
  <!-- Small sunflower -->
  <ellipse cx="310" cy="160" rx="7" ry="14" fill="#FCD34D" transform="rotate(0 310 160)"/>
  <ellipse cx="310" cy="160" rx="7" ry="14" fill="#FCD34D" transform="rotate(60 310 160)"/>
  <ellipse cx="310" cy="160" rx="7" ry="14" fill="#FCD34D" transform="rotate(120 310 160)"/>
  <circle cx="310" cy="160" r="10" fill="#92400E"/>
  <path d="M310,170 Q308,195 306,215" fill="none" stroke="#4ADE80" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Confetti -->
  <rect x="25" y="35" width="9" height="4" rx="1" fill="#FCD34D" transform="rotate(25 29 37)" opacity="0.7"/>
  <rect x="60" y="240" width="8" height="4" rx="1" fill="#F9A8D4" transform="rotate(-15 64 242)" opacity="0.6"/>
  <circle cx="40" cy="140" r="4" fill="#FCD34D" opacity="0.4"/>
  <!-- Title -->
  <text x="175" y="115" font-family="Georgia, serif" font-size="40" font-weight="bold" font-style="italic" fill="#78350F" text-anchor="middle">Happy</text>
  <text x="175" y="158" font-family="Georgia, serif" font-size="40" font-weight="bold" font-style="italic" fill="#78350F" text-anchor="middle">Birthday!</text>
  <text x="175" y="193" font-family="Georgia, serif" font-size="13" fill="#92400E" text-anchor="middle">Like a sunflower, always</text>
  <text x="175" y="211" font-family="Georgia, serif" font-size="13" fill="#92400E" text-anchor="middle">turn your face to the light!</text>
  <text x="175" y="245" font-size="14" fill="#F59E0B" text-anchor="middle">♥</text>
</svg>
