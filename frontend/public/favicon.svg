<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Thankeeu">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="heart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <!-- Soft inner highlight -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="white" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <!-- Inner highlight -->
  <rect width="64" height="64" rx="16" fill="url(#shine)"/>

  <!-- Letter T — crossbar -->
  <rect x="13" y="13" width="38" height="8" rx="4" fill="white"/>
  <!-- Letter T — stem -->
  <rect x="28" y="13" width="8" height="24" rx="4" fill="white"/>

  <!-- Heart at base of stem -->
  <path d="M32 52
           C28.5 48.5, 22 44.5, 22 40
           C22 36.8, 24.7 35, 27.2 35
           C29.2 35, 31 36.3, 32 37.8
           C33 36.3, 34.8 35, 36.8 35
           C39.3 35, 42 36.8, 42 40
           C42 44.5, 35.5 48.5, 32 52Z"
    fill="url(#heart)"/>
</svg>
