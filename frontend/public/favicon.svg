<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Thankeeu">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="white" stop-opacity="0.2"/>
      <stop offset="60%"  stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Purple rounded square background -->
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect width="64" height="64" rx="15" fill="url(#shine)"/>
  <!-- Envelope body -->
  <rect x="10" y="18" width="44" height="30" rx="5" fill="white" opacity="0.92"/>
  <!-- Envelope flap / V shape -->
  <path d="M10 18 L32 34 L54 18Z" fill="white" opacity="0.72"/>
  <!-- Heart seal -->
  <path d="M32 44
           C30 42, 26 40, 26 37.5
           C26 35.8 27.4 35 28.7 35
           C30 35 31.2 35.8 32 36.8
           C32.8 35.8 34 35 35.3 35
           C36.6 35 38 35.8 38 37.5
           C38 40 34 42 32 44Z"
        fill="#F43F5E"/>
</svg>
