<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're offline — Taskeeu</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #12091a; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 24px; }
    .box { max-width: 360px; }
    .icon { width: 72px; height: 72px; border-radius: 20px; background: linear-gradient(135deg, #ff2d62, #ff6b8f); display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; font-size: 34px; }
    h1 { font-size: 22px; font-weight: 800; margin: 0 0 12px; }
    p { color: rgba(255,255,255,0.6); line-height: 1.6; font-size: 15px; margin: 0 0 24px; }
    button { background: #ff2d62; color: #fff; border: none; border-radius: 12px; padding: 13px 28px; font-size: 15px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">&#128246;</div>
    <h1>You're offline</h1>
    <p>Taskeeu needs an internet connection. Check your network and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
