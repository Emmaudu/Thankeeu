<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#F5F0FF"/>
      <stop offset="55%"  stop-color="#FBEAF0"/>
      <stop offset="100%" stop-color="#E1F5EE"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#8B5CF6"/>
      <stop offset="50%"  stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#7C3AED" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Decorative blobs -->
  <circle cx="1080" cy="90"  r="200" fill="#8B5CF6" opacity="0.10"/>
  <circle cx="100"  cy="560" r="160" fill="#F43F5E" opacity="0.08"/>
  <circle cx="1120" cy="540" r="110" fill="#3CBE8B" opacity="0.07"/>

  <!-- Logo mark: gift box icon -->
  <rect x="80" y="64" width="56" height="56" rx="16" fill="url(#logoGrad)"/>
  <g transform="translate(96,78)" stroke="white" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="9" width="20" height="6" rx="1"/>
    <rect x="4" y="15" width="16" height="10" rx="1"/>
    <line x1="12" y1="9" x2="12" y2="25"/>
    <path d="M12 9c0-3-2.5-5-5-5s-3 2-1 4 6 1 6 1z"/>
    <path d="M12 9c0-3 2.5-5 5-5s3 2 1 4-6 1-6 1z"/>
  </g>

  <!-- Wordmark -->
  <text x="150" y="106" font-family="'Nunito',Arial,sans-serif" font-size="32" font-weight="800" fill="#1a1a1a">Thank<tspan fill="#7C3AED">eeu</tspan></text>

  <!-- Headline -->
  <text x="80" y="245" font-family="'Nunito',Arial,sans-serif" font-size="58" font-weight="800" fill="#1a1a1a">Group cards &amp; gifts</text>
  <text x="80" y="312" font-family="'Nunito',Arial,sans-serif" font-size="58" font-weight="800" fill="url(#textGrad)">that actually hit different</text>

  <!-- Subheadline -->
  <text x="80" y="365" font-family="'Nunito Sans',Arial,sans-serif" font-size="21" fill="#555">Beautiful group cards, pooled gifts via Flutterwave —</text>
  <text x="80" y="397" font-family="'Nunito Sans',Arial,sans-serif" font-size="21" fill="#555">works in NGN, USD, GBP, EUR and more.</text>

  <!-- "14 occasions" pill -->
  <rect x="80" y="430" width="200" height="44" rx="22" fill="white" opacity="0.85"/>
  <circle cx="106" cy="452" r="9" fill="#7C3AED"/>
  <text x="106" y="457" font-family="Arial,sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="700">14</text>
  <text x="126" y="458" font-family="'Nunito Sans',Arial,sans-serif" font-size="16" font-weight="700" fill="#534AB7">occasions covered</text>

  <!-- CTA buttons -->
  <rect x="80" y="500" width="200" height="56" rx="16" fill="#7C3AED"/>
  <text x="180" y="535" font-family="'Nunito Sans',Arial,sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">Create a card</text>

  <rect x="296" y="500" width="200" height="56" rx="16" fill="white" stroke="#CECBF6" stroke-width="2"/>
  <text x="396" y="535" font-family="'Nunito Sans',Arial,sans-serif" font-size="18" font-weight="700" fill="#534AB7" text-anchor="middle">Book team demo</text>

  <!-- Occasion icon chips (right side) -->
  <g font-family="'Nunito Sans',Arial,sans-serif" font-size="13" font-weight="700">

    <!-- Birthday: cake icon -->
    <rect x="760" y="80"  width="150" height="90" rx="20" fill="white" opacity="0.9"/>
    <circle cx="835" cy="118" r="22" fill="#FBEAF0"/>
    <g transform="translate(823,106)" stroke="#D4537E" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="11" width="22" height="11" rx="2"/>
      <path d="M1 16h22"/>
      <path d="M5 11v-3a2 2 0 1 1 2 0v0"/>
      <path d="M12 11v-3a2 2 0 1 1 2 0v0"/>
      <path d="M19 11v-3a2 2 0 1 1 2 0v0"/>
    </g>
    <text x="835" y="158" text-anchor="middle" fill="#534AB7">Birthday</text>

    <!-- Farewell: briefcase icon -->
    <rect x="930" y="80"  width="150" height="90" rx="20" fill="white" opacity="0.9"/>
    <circle cx="1005" cy="118" r="22" fill="#E1F5EE"/>
    <g transform="translate(993,106)" stroke="#0F6E56" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="5" width="22" height="16" rx="2"/>
      <path d="M8 5V3a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/>
      <path d="M1 12h22"/>
    </g>
    <text x="1005" y="158" text-anchor="middle" fill="#534AB7">Farewell</text>

    <!-- Anniversary: gift icon -->
    <rect x="760" y="190" width="150" height="90" rx="20" fill="white" opacity="0.9"/>
    <circle cx="835" cy="228" r="22" fill="#FFF0F5"/>
    <g transform="translate(823,216)" stroke="#9D174D" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="9" width="20" height="6" rx="1"/>
      <rect x="4" y="15" width="16" height="9" rx="1"/>
      <line x1="12" y1="9" x2="12" y2="24"/>
      <path d="M12 9c0-3-2.5-5-5-5s-3 2-1 4 6 1 6 1z"/>
      <path d="M12 9c0-3 2.5-5 5-5s3 2 1 4-6 1-6 1z"/>
    </g>
    <text x="835" y="268" text-anchor="middle" fill="#534AB7">Anniversary</text>

    <!-- Promotion: trending-up icon -->
    <rect x="930" y="190" width="150" height="90" rx="20" fill="white" opacity="0.9"/>
    <circle cx="1005" cy="228" r="22" fill="#FFFBEB"/>
    <g transform="translate(993,216)" stroke="#92400E" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="1,18 9,10 14,15 23,5"/>
      <polyline points="17,5 23,5 23,11"/>
    </g>
    <text x="1005" y="268" text-anchor="middle" fill="#534AB7">Promotion</text>
  </g>

  <!-- Gift pot preview card -->
  <rect x="760" y="310" width="320" height="130" rx="20" fill="white" opacity="0.92"/>
  <g transform="translate(788,326)" stroke="#166534" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1" y="6" width="18" height="5" rx="1"/>
    <rect x="2.5" y="11" width="15" height="9" rx="1"/>
    <line x1="10" y1="6" x2="10" y2="20"/>
  </g>
  <text x="814" y="343" font-family="'Nunito Sans',Arial,sans-serif" font-size="16" font-weight="700" fill="#166534">Gift pot collected</text>
  <text x="788" y="385" font-family="'Nunito',Arial,sans-serif" font-size="34" font-weight="800" fill="#1a1a1a">₦92,500</text>
  <text x="788" y="412" font-family="'Nunito Sans',Arial,sans-serif" font-size="14" fill="#888">24 contributors · via Flutterwave</text>

  <!-- Currency chips -->
  <g font-family="'Nunito Sans',Arial,sans-serif" font-size="14" font-weight="700" fill="#534AB7">
    <rect x="760" y="460" width="70" height="36" rx="18" fill="#F3F3FD"/>
    <text x="795" y="483" text-anchor="middle">NGN</text>
    <rect x="840" y="460" width="70" height="36" rx="18" fill="#F3F3FD"/>
    <text x="875" y="483" text-anchor="middle">USD</text>
    <rect x="920" y="460" width="70" height="36" rx="18" fill="#F3F3FD"/>
    <text x="955" y="483" text-anchor="middle">GBP</text>
    <rect x="1000" y="460" width="70" height="36" rx="18" fill="#F3F3FD"/>
    <text x="1035" y="483" text-anchor="middle">EUR</text>
  </g>

  <!-- Bottom URL bar -->
  <rect x="0" y="580" width="1200" height="50" fill="#7C3AED" opacity="0.92"/>
  <text x="600" y="611" font-family="'Nunito Sans',Arial,sans-serif" font-size="18" fill="white" text-anchor="middle" letter-spacing="2">
    thankeeu.com
  </text>
</svg>
